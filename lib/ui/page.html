<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>速成工作台 · dsh-sprint</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1b1e24;
    --panel2: #21252d;
    --line: #2c313a;
    --text: #e6e8ec;
    --muted: #8b93a1;
    --accent: #4f8cff;
    --ok: #3fb950;
    --warn: #d29922;
    --err: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .brand b { font-weight: 600; letter-spacing: .5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  header .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  input, select, button, textarea {
    font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.1); }
  button:disabled { opacity: .5; cursor: default; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .wrap { display: grid; grid-template-columns: 300px 1fr; gap: 16px; padding: 16px 18px 40px; max-width: 1280px; }
  aside h3, main h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 0 8px; letter-spacing: .5px; }
  aside h3:first-child { margin-top: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 20px; font-weight: 600; margin-top: 2px; }
  .stat .v small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .files { display: flex; flex-direction: column; gap: 6px; }
  .file {
    display: flex; gap: 10px; align-items: baseline; padding: 8px 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  }
  .file .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .s { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row input, .row select { min-width: 120px; }
  .row input.grow { flex: 1; min-width: 260px; }
  .log {
    margin: 12px 0 0; padding: 12px 14px; background: #101216; border: 1px solid var(--line);
    border-radius: 10px; max-height: 340px; overflow: auto; white-space: pre-wrap; word-break: break-word;
    font: 12px/1.6 "Cascadia Mono", Consolas, monospace; color: #cfd6e4;
  }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); color: var(--muted); }
  .badge.ok { color: var(--ok); border-color: rgba(63,185,80,.4); }
  .badge.warn { color: var(--warn); border-color: rgba(210,153,34,.4); }
  .grid2 { display: grid; grid-template-columns: 1.15fr .85fr; gap: 16px; }
  .bar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
  @media (max-width: 1000px) { .wrap { grid-template-columns: 1fr; } .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span><b>速成工作台</b><span id="sub" class="muted small"></span></div>
  <div class="right">
    <input id="dir" class="grow" style="width:320px" placeholder="项目目录，例如 G:\workplace\prepare">
    <button id="apply">切换</button>
    <button id="refresh" class="primary">刷新</button>
  </div>
</header>

<div class="wrap">
  <aside>
    <h3>科目</h3>
    <div class="card" id="subject">未加载</div>

    <h3>进度</h3>
    <div class="stats" id="stats"></div>

    <h3>待办</h3>
    <div class="card" id="next">—</div>

    <h3>老师提示</h3>
    <div class="card" id="hints">—</div>

    <h3>目录</h3>
    <div class="card small" id="dirs">—</div>
  </aside>

  <main>
    <div class="grid2">
      <section>
        <h3>交付件 / 最近文件 <span class="muted small" id="deliv"></span></h3>
        <div class="files" id="files"></div>
      </section>
      <section>
        <h3>动作</h3>
        <div class="row">
          <select id="action">
            <option value="project.init">初始化 _work</option>
            <option value="scan.pdf">抽书 / PDF</option>
            <option value="scan.ppt">抽 PPT</option>
            <option value="scan.shots">归位网课截图</option>
            <option value="render.tex">编译 LaTeX</option>
            <option value="render.preview">渲染预览</option>
            <option value="check.accept">交付自检</option>
          </select>
          <input id="arg" class="grow" placeholder="参数">
          <button id="run" class="primary">运行</button>
        </div>
        <p class="muted small" id="arghint">—</p>
        <pre class="log" id="log">就绪。先点右上角「刷新」。</pre>
      </section>
    </div>

    <h3>管道任务</h3>
    <div class="files" id="tasks"></div>
  </main>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var DIR = new URL(location.href).searchParams.get('dir') || localStorage.getItem('sprint.dir') || '';
  $('dir').value = DIR;

  var ARGS = {
    'project.init': { key: 'subject', label: '科目名（可空，默认目录名）', ph: '例如 激光原理' },
    'scan.pdf': { key: 'path', label: 'PDF 路径（相对项目目录或绝对路径）', ph: 'books/激光原理.pdf' },
    'scan.ppt': { key: 'path', label: 'PPTX 路径', ph: 'ppt/第1章.pptx' },
    'scan.shots': { key: 'path', label: '截图目录', ph: '截图' },
    'render.tex': { key: 'tex', label: '.tex 路径', ph: '_work/lect/lect.tex' },
    'render.preview': { key: 'pdf', label: 'PDF 路径', ph: '_work/lect/lect.pdf' },
    'check.accept': { key: 'pdf', label: 'PDF 或 tex 路径', ph: '_work/note/note.pdf' }
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function kb(n) {
    if (!n && n !== 0) return '';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }
  function when(ms) {
    if (!ms) return '';
    var d = new Date(ms), now = Date.now(), diff = (now - ms) / 60000;
    if (diff < 60) return Math.max(1, Math.round(diff)) + ' 分钟前';
    if (diff < 1440) return Math.round(diff / 60) + ' 小时前';
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function setLog(text) { $('log').textContent = text; }

  function syncHint() {
    var a = ARGS[$('action').value] || { label: '参数', ph: '' };
    $('arg').placeholder = a.ph;
    $('arghint').textContent = a.label;
  }
  $('action').addEventListener('change', syncHint);
  syncHint();

  function render(data) {
    if (!data.ok) {
      $('subject').innerHTML = '<span style="color:var(--warn)">' + esc(data.error || '读取失败') + '</span>';
      $('stats').innerHTML = '';
      $('files').innerHTML = '';
      $('tasks').innerHTML = '';
      return;
    }
    $('sub').textContent = data.subject ? ('· ' + data.subject) : '';
    var exam = data.exam ? ('考试：' + esc(data.exam)) : '没有记考试日';
    $('subject').innerHTML =
      '<div style="font-size:16px">' + esc(data.subject || '(未命名)') + '</div>' +
      '<div class="muted small">' + exam + '</div>' +
      '<div class="muted small">' + (data.initialized ? '<span class="badge ok">已初始化</span>' : '<span class="badge warn">未初始化</span>') +
      (data.bookOffset != null ? ' <span class="badge">页偏移 +' + data.bookOffset + '</span>' : '') + '</div>' +
      (data.hint ? '<div class="small" style="color:var(--warn);margin-top:6px">' + esc(data.hint) + '</div>' : '');

    var plan = data.plan || { total: 0, byStatus: {} };
    var done = (plan.byStatus && plan.byStatus.done) || 0;
    var drafts = data.drafts || { total: 0, byStatus: {} };
    var qs = data.questions || { total: 0, byStatus: {} };
    var hints = data.hints || { total: 0, latest: [] };
    $('stats').innerHTML =
      '<div class="stat"><div class="k">计划</div><div class="v">' + done + '<small> / ' + plan.total + '</small></div>' +
        '<div class="bar"><i style="width:' + (plan.total ? Math.round(done / plan.total * 100) : 0) + '%"></i></div></div>' +
      '<div class="stat"><div class="k">草稿</div><div class="v">' + drafts.total + '<small> 份</small></div></div>' +
      '<div class="stat"><div class="k">题目</div><div class="v">' + qs.total + '<small> 道</small></div></div>' +
      '<div class="stat"><div class="k">提示</div><div class="v">' + hints.total + '<small> 条</small></div></div>';

    if (plan.next) {
      $('next').innerHTML = '<b>' + esc(plan.next.title || plan.next.id || '下一节') + '</b>' +
        '<div class="muted small">状态：' + esc(plan.next.status || 'todo') + (plan.next.id ? ' · ' + esc(plan.next.id) : '') + '</div>';
    } else {
      $('next').innerHTML = '<span class="muted">' + (plan.total ? '计划都做完了' : '还没有计划：先 plan.coverage，或者直接在对话里推进') + '</span>';
    }

    $('hints').innerHTML = (hints.latest && hints.latest.length)
      ? hints.latest.map(function (h) { return '<div>· ' + esc(h) + '</div>'; }).join('')
      : '<span class="muted">没有记录</span>';

    $('dirs').innerHTML =
      '<div><span class="muted">项目 </span>' + esc(data.dir) + '</div>' +
      (data.outDir ? '<div><span class="muted">中间件 </span>' + esc(data.outDir) + '</div>' : '') +
      (data.deliverDir ? '<div><span class="muted">交付 </span>' + esc(data.deliverDir) + '</div>' : '');

    var files = data.recent || [];
    $('files').innerHTML = files.length ? files.map(function (f) {
      return '<div class="file"><span class="n" title="' + esc(f.path) + '">' + esc(f.name) + '</span>' +
        '<span class="s">' + kb(f.size) + ' · ' + when(f.mtime) + '</span></div>';
    }).join('') : '<div class="card muted">交付目录里还没有文件</div>';
    $('deliv').textContent = data.deliverDir ? data.deliverDir : '';

    var tasks = data.tasks || 0;
    $('tasks').innerHTML = tasks
      ? '<div class="card">已经跑过 <b>' + tasks + '</b> 个管道任务（scan / render 等）。明细在项目目录的 <code>_work/sprint.json</code>。</div>'
      : '<div class="card muted">还没有运行过管道任务。</div>';
  }

  function load() {
    $('refresh').disabled = true;
    var url = './data' + (DIR ? '?dir=' + encodeURIComponent(DIR) : '');
    fetch(url).then(function (r) { return r.json(); }).then(function (data) {
      render(data);
      if (data.ok) {
        DIR = data.dir;
        localStorage.setItem('sprint.dir', DIR);
        $('dir').value = DIR;
      }
      setLog('已刷新 ' + new Date().toLocaleTimeString() + (data.initialized ? ' · 已初始化' : ''));
    }).catch(function (e) {
      setLog('读取失败：' + e);
    }).then(function () { $('refresh').disabled = false; });
  }

  function run() {
    var action = $('action').value;
    var spec = ARGS[action] || {};
    var raw = $('arg').value.trim();
    var args = {};
    if (raw) args[spec.key] = raw;
    if (!DIR) { setLog('先在右上角填项目目录并点「切换」。'); return; }
    $('run').disabled = true;
    setLog('运行 ' + action + ' …');
    fetch('./action', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ action: action, args: args, dir: DIR })
    }).then(function (r) { return r.json(); }).then(function (res) {
      setLog('[' + action + '] ' + (res.ok ? '成功' : '失败') + ' · ' + (res.ms || 0) + ' ms\n' + JSON.stringify(res.value || res.error, null, 2));
      load();
    }).catch(function (e) {
      setLog('[' + action + '] 请求失败：' + e);
    }).then(function () { $('run').disabled = false; });
  }

  $('refresh').addEventListener('click', load);
  $('run').addEventListener('click', run);
  $('apply').addEventListener('click', function () {
    DIR = $('dir').value.trim();
    localStorage.setItem('sprint.dir', DIR);
    load();
  });
  $('dir').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('apply').click(); });

  load();
})();
</script>
</body>
</html>
